# Still analyzed for bugs/code smells, just not held to the coverage gate:
# CLI file templates run in a consumer's own project (not exercised by our
# test suites at all), build/tooling scripts, config files, the storybook
# demo host app, and storybook fixture/story data.
sonar.coverage.exclusions=packages/cli/templates/**,scripts/**,**/*.config.ts,**/*.config.js,**/*.config.cjs,**/*.config.mjs,apps/storybook-host/**,**/_fixtures.ts,**/_daasStory.tsx,**/_mockApi.tsx,**/*.stories.tsx,**/*.stories.ts
