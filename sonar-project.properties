sonar.projectKey=buildpad-ui
sonar.projectName=buildpad-ui
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/storybook-dist/**,**/*.min.js,**/playwright-report/**,**/test-results/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/.storybook/**,**/*.stories.ts,**/*.stories.tsx,**/*.daas.stories.tsx,apps/docs/**
