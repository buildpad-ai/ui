version: 1
applications:
  - appRoot: apps/storybook-host
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@10.17.0 --activate
            - REPO_ROOT="$(git rev-parse --show-toplevel)" && echo "REPO_ROOT=${REPO_ROOT}" && cd "${REPO_ROOT}" && pnpm install --frozen-lockfile
        build:
          commands:
            # Build docs as static export and copy into storybook-host public dir
            - REPO_ROOT="$(git rev-parse --show-toplevel)" && cd "${REPO_ROOT}/apps/docs" && pnpm build
            - REPO_ROOT="$(git rev-parse --show-toplevel)" && mkdir -p "${REPO_ROOT}/apps/storybook-host/public" && rm -rf "${REPO_ROOT}/apps/storybook-host/public/docs" && cp -r "${REPO_ROOT}/apps/docs/out" "${REPO_ROOT}/apps/storybook-host/public/docs"
            # Build Storybooks into the host app's public directory
            - REPO_ROOT="$(git rev-parse --show-toplevel)" && bash "${REPO_ROOT}/scripts/build-storybooks.sh"
            # Amplify exposes console env vars to the build only, not to the Next.js
            # server at runtime; the proxy routes read these at runtime, so write
            # them into .env.production. Without COOKIE_SECRET (>= 32 chars) the
            # DaaS connect/proxy routes return 500 (Storybooks still work).
            - REPO_ROOT="$(git rev-parse --show-toplevel)" && cd "${REPO_ROOT}/apps/storybook-host" && (env | grep -E '^(COOKIE_SECRET|DAAS_ALLOWED_HOSTS)=' >> .env.production || echo "WARNING - COOKIE_SECRET is not set; the DaaS proxy will be disabled")
            # Build the Next.js host app (serves Storybooks + DaaS auth proxy + docs)
            - REPO_ROOT="$(git rev-parse --show-toplevel)" && cd "${REPO_ROOT}/apps/storybook-host" && pnpm next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
