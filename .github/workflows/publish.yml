# GitHub Actions workflow: Publish packages to npm
#
# Releases in this repo are cut LOCALLY with scripts/release-local.sh, because
# this repo's Actions cannot create pull requests. That is not a preference:
# the changesets "Version Packages" PR step fails on every push that carries a
# changeset, and left a `changeset-release/main` branch behind each time, so
# every release came with a red Publish run to discount and a branch to delete
# by hand. This workflow now skips that path instead of failing on it (see
# "Publish to npm" below).
#
# What still runs here:
#
# A) **After CI succeeds on main, with NO pending changesets** — i.e. the push
#    of a release commit that scripts/release-local.sh already versioned.
#    `changeset publish` runs; the local script normally publishes first, so
#    this is usually a no-op that simply reports success.
#
# B) **Manual dispatch**
#    Go to Actions → "Publish" → "Run workflow" to publish immediately. A
#    manual run repeats CI's typecheck and unit tests before publishing.
#
# The automated path runs only after CI succeeds on a push to main, and only
# for the commit CI tested: if main has moved on since, the newer commit's CI
# run triggers its own publish. Previously this workflow ran on the same push
# as CI without waiting for it, so releases went to npm from a red main.
#
name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # `github.sha` is main's tip when the event fires, so the sha check skips
    # a run whose tested commit is no longer the tip. The event check keeps
    # out pull_request runs from forks whose branch happens to be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create git tags & update CHANGELOG
      pull-requests: write  # create the "Version Packages" PR
      id-token: write       # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for changeset detection

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The automated trigger only fires after CI passed on this exact commit;
      # a manual dispatch has no such guarantee, so check here.
      # `test:coverage`, not `test`: the per-package coverage floors are only
      # enforced under --coverage, so `pnpm test` would pass a tree CI fails.
      - name: Typecheck and unit tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm -r typecheck
          pnpm test:coverage

      # Changesets will either:
      # - open a "Version Packages" PR (if there are unreleased changesets), or
      # - publish to npm (if that PR was just merged and versions were bumped)
      #
      # `version` regenerates packages/registry.json in the SAME step that bumps
      # the package versions, so the bot's "version packages" commit carries a
      # registry that matches them. Previously a human had to remember to run
      # `pnpm build:registry` inside the release PR; forgetting it failed
      # `registry:check`, and running it before the bump wrote the wrong
      # `lastChangedIn` values.
      #
      # The chain lives in the `version:packages` script, NOT inline here:
      # changesets/action splits this input on whitespace and execs it directly
      # rather than through a shell, so an inline `a && b` is passed to
      # `changeset` as arguments ("Too many arguments passed to changesets").
      # With changesets pending, changesets/action takes its VERSION path: it
      # commits the bump to a `changeset-release/main` branch, pushes it, then
      # opens the "Version Packages" PR — and that last step cannot succeed
      # here, so the run goes red and the branch is left behind. Releases are
      # cut locally instead, so detect that case and skip rather than fail.
      #
      # With zero changesets the action takes its PUBLISH path, which works;
      # that is the case this workflow exists for.
      - name: Check for pending changesets
        id: pending
        run: |
          set -euo pipefail
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -gt 0 ]; then
            echo "::notice title=Nothing to publish::${count} pending changeset(s). Cut the release locally with scripts/release-local.sh --execute; this workflow publishes only an already-versioned commit."
          fi

      # `version:` is retained so this step is correct the day Actions can open
      # a PR in this repo; until then the `if` above means it never runs.
      - name: Create Release PR or Publish
        id: changesets
        if: steps.pending.outputs.count == '0'
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm version:packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # One plain, unambiguous tag per release, next to the changesets
      # per-package tags.
      #
      # The CLI pins every source fetch to `v<its own version>`, so this tag is
      # what makes a release reachable at all: without it `add` cannot resolve
      # its own sources and `upgrade` cannot resolve a diff3 base. The
      # changesets tags cannot serve that purpose — their names contain `/` and
      # `@`, which are ambiguous in a raw-CDN path, and they were incomplete in
      # practice (@buildpad/cli and @buildpad/mcp went untagged at 1.9.3 and
      # 1.11.1, and 1.11.0 shipped to npm with no tag or commit at all).
      - name: Tag the release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally — nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on the remote — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"
          echo "Pushed ${TAG}"
